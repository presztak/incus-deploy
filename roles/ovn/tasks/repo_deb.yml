---
- name: Create apt keyring path
  ansible.builtin.file:
    path: /etc/apt/keyrings/
    mode: "0755"
    state: directory
  when: 'ovn_roles|length > 0 and ovn_release != "distro"'

- name: Add Zabbly repository key
  ansible.builtin.get_url:
    url: "https://pkgs.zabbly.com/key.asc"
    dest: "/etc/apt/keyrings/ansible-zabbly.asc"
    mode: "0644"
  notify: Update apt
  when: 'ovn_roles|length > 0 and ovn_release == "ppa"'

- name: Get DPKG architecture
  ansible.builtin.command: dpkg --print-architecture
  register: ovn_dpkg_architecture
  changed_when: false
  check_mode: false
  when: 'ovn_roles|length > 0 and ovn_release == "ppa"'

- name: Add Zabbly package source
  ansible.builtin.template:
    src: ovn-ppa.sources.j2
    dest: /etc/apt/sources.list.d/ansible-zabbly-ovn-{{ incus_release }}.sources
    mode: "0644"
  notify: Update apt
  when: 'ovn_roles|length > 0 and ovn_release == "ppa"'
